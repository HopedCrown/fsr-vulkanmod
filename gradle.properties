# Our own mod's version number, read by build.gradle.
mod_version=0.1.0
# Our mod's Maven group id, used for publishing metadata.
maven_group=net.fsrvulkanmod
# The exact Minecraft version we target, per your request (mc26.1.2).
minecraft_version=26.1.2
# Yarn mapping version matching that Minecraft release — VERIFY against
# https://fabricmc.net/develop/ before building; mapping strings change often.
yarn_mappings=26.1.2+build.1
# Fabric Loader version, kept reasonably current.
loader_version=0.16.10
# Fabric API build matching 26.1.2 — VERIFY on Modrinth/CurseForge before building.
fabric_version=0.110.0+26.1.2
# VulkanMod release that targets 26.1.2, per the Modrinth listing (0.6.8+26.1.2).
vulkanmod_version=0.6.8+26.1.2
# YACL build compatible with Minecraft 26.1.2 — VERIFY on Modrinth before building.
yacl_version=3.6.1+26.1.2
# Mod Menu build compatible with Minecraft 26.1.2 — VERIFY on Modrinth before building.
modmenu_version=11.0.3
